name: Build & Release

# Produces a ready-to-run, zipped Windows build so people can just download it
# instead of installing Visual Studio. Runs on version tags — both `v1.2.3`
# and bare `1.2.3` (the repo's existing releases use bare tags) — and can also
# be started by hand from the Actions tab.
on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The native FFmpeg 7.x shared DLLs aren't committed (see .gitignore), so
      # fetch a matching build and drop them where the csproj expects them.
      #
      # The URL is pinned to a specific BtbN autobuild snapshot instead of the
      # floating `latest` tag: FFmpeg.AutoGen 7.1.1 binds ONLY FFmpeg 7.x
      # natives (avcodec-61 etc.), and `latest` will one day silently move to
      # FFmpeg 8.x (avcodec-62), which would publish a zip with no working
      # video decode. Month-end autobuild tags are the ones BtbN retains
      # long-term. When bumping this pin, stay on an n7.1.x asset unless
      # FFmpeg.AutoGen is upgraded in lockstep.
      - name: Fetch FFmpeg 7.1 shared DLLs (pinned)
        shell: pwsh
        run: |
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-06-30-13-34/ffmpeg-n7.1.5-1-g7d0e842004-win64-gpl-shared-7.1.zip'
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extract
          $bin = Get-ChildItem ffmpeg-extract -Recurse -Directory -Filter bin | Select-Object -First 1
          if (-not $bin) { throw "bin/ folder not found in the FFmpeg zip - layout changed?" }
          $dest = 'src/AirPlayReceiver/native/x64'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "$($bin.FullName)/*.dll" $dest

      - name: Publish (self-contained x64)
        run: >
          dotnet publish src/AirPlayReceiver/AirPlayReceiver.csproj
          -c Release -r win-x64 --self-contained true
          -p:Platform=x64 -p:WindowsPackageType=None
          -o publish

      # Hard gate: never ship a zip that is missing the video-decode DLLs.
      # The 1.0.0 installer shipped without them and mirrored only black
      # video — this step makes that class of release impossible.
      - name: Verify publish output is complete
        shell: pwsh
        run: |
          $required = @(
            'publish/AirPlayReceiver.exe',
            'publish/playfair.dll',
            'publish/native/x64/avcodec-61.dll',
            'publish/native/x64/avutil-59.dll',
            'publish/native/x64/swscale-8.dll',
            'publish/native/x64/swresample-5.dll',
            'publish/native/x64/avformat-61.dll'
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            $missing | ForEach-Object { Write-Error "MISSING: $_" }
            throw "Publish output is incomplete - refusing to package a broken build."
          }
          Write-Host "All required files present:"
          $required | ForEach-Object {
            $len = (Get-Item $_).Length
            Write-Host ("  {0}  ({1:N0} bytes)" -f $_, $len)
          }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath AirPlayReceiver-win-x64.zip

      # Every run leaves a downloadable zip on the Actions run page, even
      # without a tag.
      - uses: actions/upload-artifact@v4
        with:
          name: AirPlayReceiver-win-x64
          path: AirPlayReceiver-win-x64.zip

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: AirPlayReceiver-win-x64.zip
          generate_release_notes: true
