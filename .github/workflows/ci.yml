name: CI

# Compile check on every push to main and every PR, so broken commits can't
# land silently. Compiling doesn't need the native FFmpeg DLLs (they're only
# loaded at runtime), so this stays minimal and fast — no publish, no zip.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (Release x64)
        run: >
          dotnet build src/AirPlayReceiver/AirPlayReceiver.csproj
          -c Release -p:Platform=x64
